<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wilter & Wesley — Redes DF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @keyframes pulse-dot { 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
  :root{
    --bg:#f6f6f8; --panel:#ffffff; --panel2:#f4f4f6;
    --line:#e6e6ea; --line-strong:#d6d6dc;
    --text:#1a1a24; --muted:#83838f;
    --accent:#6a5cff; --accent-dim:#eeecff;
    --amber:#c47d13; --amber-dim:#fdf1de;
    --danger:#d5493a; --danger-dim:#fbe9e7;
    --ok-bg:#e7f7ee; --ok-text:#1a9c5e;
    --pend-bg:#fdf1de; --pend-text:#c47d13;
  }
  body {
    margin:0; background:var(--bg); -webkit-tap-highlight-color:transparent;
    font-family:'Space Grotesk',sans-serif; color:var(--text);
  }
  * { box-sizing:border-box; }
  ::selection { background:var(--accent-dim); color:var(--accent); }
  a { color:var(--accent); }
  ::-webkit-scrollbar { height:0; width:0; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 2px rgba(20,20,40,.04); }
  .row { display:flex; justify-content:space-between; align-items:center; padding:11px 14px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .label { font-size:10.5px; color:var(--muted); text-transform:uppercase; font-weight:600; letter-spacing:.4px; }
  .muted { color:var(--muted); }
  .badge { font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; letter-spacing:.1px; }
  .badge.ok { background:var(--ok-bg); color:var(--ok-text); }
  .badge.pend { background:var(--pend-bg); color:var(--pend-text); }
  .tabbtn { flex:1; min-width:78px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px 8px; background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer; color:var(--muted); font-family:'Space Grotesk',sans-serif; }
  .tabbtn.active { border-bottom-color:var(--accent); color:var(--accent); }
  .empty { padding:16px 14px; font-size:12.5px; color:var(--muted); text-align:center; font-family:'Space Grotesk',sans-serif; }
  select.sel { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:600; color:var(--text); }
  .tabpage { display:none; flex-direction:column; gap:16px; }
  .tabpage.active { display:flex; }
  form.inline { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  form.inline input, form.inline select { background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:8px; font-family:'Space Grotesk',sans-serif; font-size:12.5px; flex:1; min-width:110px; }
  form.inline input:focus, form.inline select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  .btn { background:var(--accent); color:#fff; border:none; padding:9px 16px; border-radius:9px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer; }
  .btn.ghost { background:var(--panel2); border:1px solid var(--line); color:var(--text); }
  .btn.small { padding:6px 11px; font-size:11.5px; }
  .admin-panel { border:1px solid var(--amber); border-radius:14px; padding:12px; background:var(--amber-dim); }
  .admin-panel .title { font-size:11px; font-weight:700; color:var(--amber); text-transform:uppercase; margin-bottom:8px; letter-spacing:.4px; }
</style>
</head>
<body>

<div style="min-height:100vh; background:#f6f6f8; display:flex; justify-content:center;">
<div style="width:100%; max-width:560px; min-height:100vh; background:#f6f6f8; display:flex; flex-direction:column;">

  <div style="background:#ffffff; color:#1a1a24; padding:18px 18px 14px; display:flex; flex-direction:column; gap:4px; border-bottom:1px solid #e6e6ea;">
    <div style="font-size:19px; font-weight:700; display:flex; justify-content:space-between; align-items:center;">
      <span>Wilter &amp; Wesley</span>
      <button id="adminBtn" style="background:#f4f4f6; border:1px solid #e6e6ea; color:#1a1a24; font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600; padding:6px 11px; border-radius:20px; cursor:pointer; display:flex; align-items:center; gap:5px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span id="adminBtnLabel">Admin</span>
      </button>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="font-size:12.5px; opacity:.75; font-weight:500;">Redes DF · financeiro do serviço</div>
      <div style="display:flex; align-items:center; gap:6px; font-size:11px; opacity:.85; cursor:pointer;" class="mono" id="refreshTrigger" title="Atualizar agora">
        <span style="width:7px; height:7px; border-radius:50%; background:#6a5cff; display:inline-block; animation:pulse-dot 1.6s ease-in-out infinite;"></span>
        <span id="lastUpdateLabel">atualizando...</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      </div>
    </div>
  </div>

  <div style="display:flex; background:#ffffff; border-bottom:1px solid #e6e6ea; overflow-x:auto;" id="tabStrip"></div>

  <div style="flex:1; padding:16px 16px 40px;">
    <div class="tabpage active" id="tab-resumo"></div>
    <div class="tabpage" id="tab-obras"></div>
    <div class="tabpage" id="tab-equipe"></div>
    <div class="tabpage" id="tab-gastos"></div>
    <div class="tabpage" id="tab-recebimentos"></div>
  </div>

</div>
</div>

<script>
const SUPABASE_URL = "https://vqvjluufkhzjhigtnssz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_juxbppxkxS-ZKSdCSKXETg_mfJs1U_m";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const VALOR_PONTO_REDE = 130, VALOR_PONTO_WIFI = 400;

const BRL = v => (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const brDate = iso => { if(!iso) return '—'; const p = iso.split('-'); return p.length===3 ? `${p[2]}/${p[1]}` : iso; };
const todayStr = () => new Date().toISOString().slice(0,10);

const ICONS = {
  resumo: '<path d="M4 19V10M10 19V5M16 19V13M22 19V8"></path>',
  obras: '<path d="M4 21V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v16M12 21v-9a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v9M4 21h18M8 8h1M8 12h1M15 12h1"></path>',
  equipe: '<path d="M17 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 5 18.5V20M11 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19 20v-1.5a3 3 0 0 0-2-2.83M15 4.2a3 3 0 0 1 0 5.6"></path>',
  gastos: '<path d="M6 3h11a1 1 0 0 1 1 1v17l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.2V4a1 1 0 0 1 1-1Z M9 8h6M9 12h6M9 16h3"></path>',
  recebimentos: '<path d="M3 7h18v12H3zM3 7l2-3h14l2 3M12 12.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"></path>',
};
const TABS = [
  {id:'resumo', label:'Resumo'}, {id:'obras', label:'Serviços'}, {id:'equipe', label:'Equipe'},
  {id:'gastos', label:'Gastos'}, {id:'recebimentos', label:'Recebim.'}
];

let state = { obras:[], workers:[], expenses:[], attendance:[], advances:[], payments:[] };
let activeTab = 'resumo';
let selectedObraId = null;
let selectedMonth = 'todos';
let editingObraId = null;
let editingWorkerId = null;
let editingExpenseId = null;
let expandedPessoa = null;
let secondsAgo = 0;

const ADMIN_PASSWORD = "40302010";
let isAdmin = false;

function setupAdminButton(){
  const btn = document.getElementById('adminBtn');
  const label = document.getElementById('adminBtnLabel');
  function refresh(){ label.textContent = isAdmin ? 'Sair do admin' : 'Admin'; }
  refresh();
  btn.addEventListener('click', ()=>{
    if(isAdmin){
      isAdmin = false;
      refresh();
      renderAll();
      return;
    }
    const val = prompt('Senha do admin:');
    if(val === ADMIN_PASSWORD){
      isAdmin = true;
      refresh();
      renderAll();
    } else if(val !== null){
      alert('Senha incorreta.');
    }
  });
}

function svgIcon(name){
  return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}

function renderTabStrip(){
  const strip = document.getElementById('tabStrip');
  strip.innerHTML = TABS.map(t => `
    <button class="tabbtn ${activeTab===t.id?'active':''}" data-tab="${t.id}">
      ${svgIcon(t.id)}
      <span style="font-size:10.5px; font-weight:600;">${t.label}</span>
    </button>`).join('');
  strip.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      activeTab = b.dataset.tab;
      document.querySelectorAll('.tabpage').forEach(p=>p.classList.remove('active'));
      document.getElementById('tab-'+activeTab).classList.add('active');
      renderTabStrip();
    });
  });
}

function obraTotal(o){ return (o.pontos_rede||0)*VALOR_PONTO_REDE + (o.pontos_wifi||0)*VALOR_PONTO_WIFI; }
function obraRecebido(id){ return state.payments.filter(p=>p.obra_id===id).reduce((s,p)=>s+Number(p.amount),0); }
function attendanceValue(a){
  // valor combinado (fixo) tem prioridade sobre o cálculo por diária
  if(a.fixed_amount != null){
    const total = Number(a.fixed_amount);
    if(a.paid) return total;
    return Math.max(total - Number(a.paid_amount||0), 0);
  }
  const w = state.workers.find(w=>w.id===a.worker_id);
  if(!w || w.rate==null) return 0;
  const valorDia = (w.rate_type==='dia' || w.rate_type==='ponto') ? w.rate*(a.count||1) : w.rate;
  if(a.paid) return valorDia;
  return Math.max(valorDia - Number(a.paid_amount||0), 0);
}
function advanceBalance(workerId){
  return state.advances.filter(a=>a.worker_id===workerId).reduce((s,a)=>s+Number(a.balance||0),0);
}
function statusStyle(positivo){ return positivo ? 'badge ok' : 'badge pend'; }
function gastoStatusLabel(e){
  const isSaqueLucro = (e.category||'').toLowerCase().includes('saque');
  if(isSaqueLucro) return e.reimbursed ? 'pró-labore pago' : 'pró-labore pendente';
  return e.reimbursed ? 'reembolsado' : 'pendente';
}

async function loadAll(){
  try{
    const [{data:obras},{data:workers},{data:expenses},{data:attendance},{data:advances},{data:payments}] = await Promise.all([
      sb.from('obras').select('*').order('created_at'),
      sb.from('workers').select('*').order('name'),
      sb.from('expenses').select('*').order('date',{ascending:false}),
      sb.from('attendance').select('*').order('date',{ascending:false}),
      sb.from('advances').select('*').order('date',{ascending:false}),
      sb.from('payments').select('*').order('date',{ascending:false}),
    ]);
    state = { obras:obras||[], workers:workers||[], expenses:expenses||[], attendance:attendance||[], advances:advances||[], payments:payments||[] };
    if(!selectedObraId && state.obras.length) selectedObraId = state.obras[0].id;
    secondsAgo = 0;
    hideErrorBanner();
    renderAll();
  }catch(err){
    console.error('Erro em loadAll:', err);
    showErrorBanner('Erro ao carregar dados: ' + (err && err.message ? err.message : String(err)));
  }
}

function showErrorBanner(msg){
  let b = document.getElementById('fatalErrorBanner');
  if(!b){
    b = document.createElement('div');
    b.id = 'fatalErrorBanner';
    b.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:999; background:#fbe9e7; color:#a3271e; font-family:monospace; font-size:12px; padding:12px 14px; white-space:pre-wrap; word-break:break-word; border-bottom:1px solid #d5493a;';
    document.body.prepend(b);
  }
  b.textContent = msg;
  b.style.display = 'block';
}
function hideErrorBanner(){
  const b = document.getElementById('fatalErrorBanner');
  if(b) b.style.display = 'none';
}

function renderAll(){
  try{
    renderTabStrip();
    renderResumo();
    renderObras();
    renderEquipe();
    renderGastos();
    renderRecebimentos();
    hideErrorBanner();
  }catch(err){
    console.error('Erro em renderAll:', err);
    showErrorBanner('Erro ao desenhar o painel: ' + (err && err.message ? err.message : String(err)) + (err && err.stack ? '\n' + err.stack.split('\n').slice(0,3).join('\n') : ''));
  }
}

/* ===== RESUMO ===== */
function monthKey(iso){ return iso ? iso.slice(0,7) : null; } // "2026-07"
function monthLabel(key){
  const [y,m] = key.split('-');
  const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${nomes[parseInt(m,10)-1]}/${y.slice(2)}`;
}
function allMonthsAvailable(){
  const keys = new Set();
  [...state.expenses, ...state.payments, ...state.advances].forEach(x=>{ if(x.date) keys.add(monthKey(x.date)); });
  return [...keys].sort().reverse();
}
function daysSince(dateStr){
  if(!dateStr) return null;
  const diff = Date.now() - new Date(dateStr).getTime();
  return Math.floor(diff / (1000*60*60*24));
}

function renderResumo(){
  const concluidas = state.obras.filter(o=>o.status==='concluída');
  const emAndamento = state.obras.filter(o=>o.status!=='concluída');

  const aReceberConcluidas = concluidas.reduce((s,o)=>s+(obraTotal(o)-obraRecebido(o.id)),0);
  const previsaoFaturamento = emAndamento.reduce((s,o)=>s+(obraTotal(o)-obraRecebido(o.id)),0);
  const totalRecebido = state.payments.reduce((s,p)=>s+Number(p.amount),0);
  const totalGasto = state.expenses.reduce((s,e)=>s+Number(e.amount),0);
  const pendenteReembolso = state.expenses.filter(e=>!e.reimbursed).reduce((s,e)=>s+Number(e.amount),0);
  const folhaPendente = state.workers.reduce((sum,w)=>{
    const pend = state.attendance.filter(a=>!a.paid && a.worker_id===w.id).reduce((s,a)=>s+attendanceValue(a),0);
    return sum + Math.max(pend - advanceBalance(w.id), 0);
  },0);
  const saldoCaixa = state.payments.reduce((s,p)=>s+Number(p.remaining||0),0);

  // colégios concluídos com saldo pendente = precisa dar o check de recebido
  const pendentesConcluidos = concluidas.filter(o=>(obraTotal(o)-obraRecebido(o.id))>0.005);

  const cards = [
    ['A receber (concluídos)', BRL(aReceberConcluidas), '#6a5cff'],
    ['Previsão de faturamento (em andamento)', BRL(previsaoFaturamento), '#8b7cff'],
    ['Total recebido', BRL(totalRecebido), '#6a5cff'],
    ['Total gasto', BRL(totalGasto), '#1a1a24'],
    ['Pendente de reembolso', BRL(pendenteReembolso), '#c47d13'],
    ['Folha equipe pendente', BRL(folhaPendente), '#c47d13'],
  ];
  const cardsHtml = cards.map(([label,val,color])=>`
    <div class="card" style="padding:12px;">
      <div class="label">${label}</div>
      <div class="mono" style="font-size:20px; font-weight:700; color:${color}; margin-top:6px;">${val}</div>
    </div>`).join('') + `
    <div style="background:#6a5cff; border:1px solid #6a5cff; border-radius:14px; padding:12px; box-shadow:0 1px 2px rgba(20,20,40,.04);">
      <div style="font-size:11px; font-weight:600; color:#ded9ff; text-transform:uppercase;">Saldo em caixa</div>
      <div class="mono" style="font-size:20px; font-weight:700; color:#ffffff; margin-top:6px;">${BRL(saldoCaixa)}</div>
    </div>`;

  const alertaHtml = pendentesConcluidos.length ? `
    <div class="card" style="padding:13px; border-color:#c47d13;">
      <div style="font-size:13px; font-weight:700; color:#c47d13;">⏳ ${pendentesConcluidos.length} colégio(s) concluído(s) esperando recebimento</div>
      <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
        ${pendentesConcluidos.map(o=>{
          const dias = daysSince(o.concluded_at);
          const saldo = obraTotal(o)-obraRecebido(o.id);
          return `<div class="row" style="padding:6px 0; border-bottom:1px solid #e6e6ea;">
            <span style="font-size:12.5px; font-weight:600;">${o.name}</span>
            <span style="font-size:11.5px; color:#c47d13;">${dias!=null?dias+' dias':'?'} · ${BRL(saldo)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  // próximas entregas (colégios em andamento com data prevista)
  const proximasEntregas = emAndamento
    .filter(o=>o.data_entrega_prevista)
    .sort((a,b)=>a.data_entrega_prevista.localeCompare(b.data_entrega_prevista));
  const entregasHtml = proximasEntregas.length ? `
    <div class="card" style="overflow:hidden;">
      ${proximasEntregas.map(o=>{
        const rest = daysUntil(o.data_entrega_prevista);
        const atrasado = rest < 0;
        const cor = atrasado ? '#d5493a' : (rest<=2 ? '#c47d13' : '#6a5cff');
        const txt = atrasado ? `atrasado ${Math.abs(rest)}d` : (rest===0 ? 'hoje' : `${rest}d`);
        return `<div class="row">
          <div style="display:flex; flex-direction:column; gap:2px;">
            <span style="font-size:13px; font-weight:600;">${o.name}</span>
            <span style="font-size:10.5px; color:#83838f;">${brDate(o.data_entrega_prevista)}</span>
          </div>
          <span class="mono" style="font-size:13px; font-weight:700; color:${cor};">${txt}</span>
        </div>`;
      }).join('')}
    </div>` : '';

  const byPerson = {};
  state.expenses.filter(e=>!e.reimbursed).forEach(e=>{ byPerson[e.paid_by]=(byPerson[e.paid_by]||0)+Number(e.amount); });
  const reembolsoHtml = Object.entries(byPerson).length
    ? Object.entries(byPerson).map(([p,v])=>{
        const isOpen = expandedPessoa===p;
        const transacoes = state.expenses.filter(e=>e.paid_by===p).sort((a,b)=>b.date.localeCompare(a.date));
        const detalheHtml = isOpen ? `
          <div style="padding:0 14px 10px;">
            ${transacoes.map(t=>{
              const o = state.obras.find(o=>o.id===t.obra_id);
              return `<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid #e6e6ea;">
                <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
                  <span style="font-size:12.5px; font-weight:600;">${t.description}</span>
                  <span style="font-size:10.5px; color:#83838f;">${brDate(t.date)} · ${t.category} · ${o?o.name:'Geral'}</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="${statusStyle(t.reimbursed)}" style="font-size:9.5px;">${gastoStatusLabel(t)}</span>
                  <span class="mono" style="font-size:12.5px; font-weight:700;">${BRL(t.amount)}</span>
                </div>
              </div>`;
            }).join('') || `<div class="empty">Nenhuma transação encontrada.</div>`}
          </div>` : '';
        return `<div>
          <div class="row" style="cursor:pointer;" onclick="expandedPessoa=expandedPessoa==='${p}'?null:'${p}'; renderResumo();">
            <span style="font-size:13.5px; font-weight:600;">${p} <span style="color:#83838f; font-size:11px;">${isOpen?'▲':'▼'} (${transacoes.length})</span></span>
            <span class="mono" style="font-size:14px; font-weight:600; color:#c47d13;">${BRL(v)}</span>
          </div>
          ${detalheHtml}
        </div>`;
      }).join('')
    : `<div class="empty">Nada pendente.</div>`;

  const months = allMonthsAvailable();
  const monthOptions = `<option value="todos">Todos os meses</option>` + months.map(m=>`<option value="${m}" ${m===selectedMonth?'selected':''}>${monthLabel(m)}</option>`).join('');

  let feed = [
    ...state.expenses.map(e=>({data:e.date, tipo:'Gasto', desc:e.description, valor:-e.amount})),
    ...state.payments.map(p=>({data:p.date, tipo:'Recebimento', desc:p.note, valor:p.amount})),
    ...state.advances.map(a=>({data:a.date, tipo:'Adiantamento', desc:(state.workers.find(w=>w.id===a.worker_id)||{}).name||'?', valor:-a.amount})),
  ];
  if(selectedMonth !== 'todos') feed = feed.filter(f=>monthKey(f.data)===selectedMonth);
  feed = feed.sort((a,b)=>b.data.localeCompare(a.data)).slice(0,selectedMonth==='todos'?10:100);

  const feedHtml = feed.length ? feed.map(f=>`
    <div class="row" style="align-items:center; gap:10px;">
      <div style="display:flex; flex-direction:column; gap:2px; min-width:0;">
        <span style="font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${f.desc||''}</span>
        <span style="font-size:11px; color:#83838f;">${brDate(f.data)} · ${f.tipo}</span>

/* ===== OBRAS ===== */
const VALOR_MAX_PONTO = 80; // teto de custo de mão de obra por ponto
function obraLaborBudget(o){ return (o.pontos_rede||0) * VALOR_MAX_PONTO; }
function obraLaborSpent(obraId){
  const doAtendimento = state.attendance.filter(a=>a.obra_id===obraId).reduce((s,a)=>{
    if(a.fixed_amount!=null) return s + Number(a.fixed_amount);
    const w = state.workers.find(w=>w.id===a.worker_id);
    if(!w || w.rate==null) return s;
    return s + w.rate * (a.count||1);
  }, 0);
  // adiantamento já entregue mas ainda não descontado de nenhum trabalho lançado
  // (assim que o trabalho for registrado e o adiantamento consumido, o saldo dele cai
  // e o valor passa a contar do lado do atendimento — nunca conta nos dois ao mesmo tempo)
  const adiantamentoNaoConsumido = state.advances.filter(a=>a.obra_id===obraId).reduce((s,a)=>s+Number(a.balance||0), 0);
  return doAtendimento + adiantamentoNaoConsumido;
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const alvo = new Date(dateStr+'T00:00:00');
  return Math.round((alvo - hoje) / (1000*60*60*24));
}

function renderObras(){
  const cardsHtml = state.obras.map(o=>{
    const total=obraTotal(o), recebido=obraRecebido(o.id), saldo=total-recebido;
    const positivo = o.status==='concluída';
    const dias = positivo ? daysSince(o.concluded_at) : null;

    if(isAdmin && editingObraId===o.id){
      return `
      <div class="card admin-panel" style="padding:13px;">
        <div class="title">Editando colégio</div>
        <form class="inline" onsubmit="return salvarObraSubmit(event,'${o.id}')" style="border-top:none; margin-top:0; padding-top:0;">
          <input name="name" value="${o.name}" placeholder="Nome" required>
          <input name="pontos_rede" type="number" min="0" value="${o.pontos_rede}" placeholder="Pontos de rede" required>
          <input name="pontos_wifi" type="number" min="0" value="${o.pontos_wifi}" placeholder="Racks" required>
          <select name="status"><option value="em andamento" ${!positivo?'selected':''}>Em andamento</option><option value="concluída" ${positivo?'selected':''}>Concluída</option></select>
          <label style="font-size:10.5px; color:#83838f; width:100%;">Data prevista de entrega
            <input name="data_entrega_prevista" type="date" value="${o.data_entrega_prevista||''}">
          </label>
          <button type="submit" class="btn small">Salvar</button>
          <button type="button" class="btn small ghost" onclick="editingObraId=null; renderObras();">Cancelar</button>
        </form>
      </div>`;
    }

    const adminAction = isAdmin
      ? `<div style="display:flex; gap:6px; margin-top:10px;" onclick="event.stopPropagation();">
          ${!positivo ? `<button class="btn small" onclick="marcarConcluida('${o.id}')">Marcar como concluída</button>` : ''}
          <button class="btn small ghost" onclick="editingObraId='${o.id}'; renderObras();">Editar</button>
        </div>`
      : '';

    // contagem regressiva de entrega
    let entregaHtml = '';
    if(!positivo && o.data_entrega_prevista){
      const rest = daysUntil(o.data_entrega_prevista);
      const atrasado = rest < 0;
      const cor = atrasado ? '#d5493a' : (rest<=2 ? '#c47d13' : '#6a5cff');
      const txt = atrasado ? `atrasado ${Math.abs(rest)}d` : (rest===0 ? 'entrega é hoje' : `faltam ${rest}d pra entrega`);
      entregaHtml = `<div style="margin-top:6px; font-size:11px; color:${cor}; font-weight:600;">📅 ${brDate(o.data_entrega_prevista)} — ${txt}</div>`;
    }

    // margem de lucro: verde (dentro do padrão) / laranja (passou do teto mas ainda lucra) / vermelho (prejuízo)
    const orcamento = obraLaborBudget(o);
    const gasto = obraLaborSpent(o.id);
    const receitaPontos = (o.pontos_rede||0) * VALOR_PONTO_REDE;
    const estourou = gasto > orcamento + 0.005;
    const margemPadrao = ((VALOR_PONTO_REDE - VALOR_MAX_PONTO) / VALOR_PONTO_REDE) * 100;
    const margemReal = receitaPontos>0 ? ((receitaPontos - gasto) / receitaPontos) * 100 : margemPadrao;
    const prejuizo = margemReal < 0;
    let margemCor, margemTexto;
    if(prejuizo){ margemCor = '#d5493a'; margemTexto = `Prejuízo de ${Math.abs(margemReal).toFixed(1)}%`; }
    else if(estourou){ margemCor = '#c47d13'; margemTexto = `Margem de lucro: ${margemReal.toFixed(1)}%`; }
    else { margemCor = '#6a5cff'; margemTexto = `Margem de lucro: ${margemPadrao.toFixed(1)}%`; }
    const margemHtml = orcamento>0 ? `
      <div style="margin-top:8px; font-size:12px; font-weight:700; color:${margemCor};">${margemTexto}</div>` : '';

    return `
    <div class="card" style="padding:13px; cursor:pointer;" onclick="selectedObraId='${o.id}'; renderObras(); document.getElementById('obraDetailAnchor').scrollIntoView({behavior:'smooth', block:'start'});">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div style="font-size:14px; font-weight:700; line-height:1.25;">${o.name} <span style="color:#83838f; font-size:11px;">▾ ver histórico</span></div>
        <span class="${statusStyle(positivo)}">${o.status}${dias!=null && saldo>0.005 ? ` · ${dias}d` : ''}</span>
      </div>
      <div style="font-size:11.5px; color:#83838f; margin-top:4px;">${o.pontos_rede} pontos de rede · ${o.pontos_wifi} racks</div>
      ${entregaHtml}
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px 8px; margin-top:10px;">
        <div><div class="label" style="font-size:10px;">Contrato</div><div class="mono" style="font-size:14px; font-weight:700;">${BRL(total)}</div></div>
        <div><div class="label" style="font-size:10px;">Recebido</div><div class="mono" style="font-size:14px; font-weight:700; color:#6a5cff;">${BRL(recebido)}</div></div>
        <div><div class="label" style="font-size:10px;">Gasto</div><div class="mono" style="font-size:14px; font-weight:700; color:${gasto>orcamento?'#d5493a':'#c47d13'};">${BRL(gasto)}</div></div>
        <div><div class="label" style="font-size:10px;">Saldo</div><div class="mono" style="font-size:14px; font-weight:700; color:#c47d13;">${BRL(saldo)}</div></div>
      </div>
      ${margemHtml}
      ${adminAction}
    </div>`;
  }).join('') || `<div class="empty">Nenhum colégio cadastrado.</div>`;

  const options = state.obras.map(o=>`<option value="${o.id}" ${o.id===selectedObraId?'selected':''}>${o.name}</option>`).join('');

  const o = state.obras.find(x=>x.id===selectedObraId);
  const items = [];
  if(o){
    state.payments.filter(p=>p.obra_id===o.id).forEach(p=>items.push({data:p.date, desc:'Recebimento — '+p.note, valor:p.amount, cor:'#6a5cff'}));
    state.expenses.filter(e=>e.obra_id===o.id).forEach(e=>items.push({data:e.date, desc:e.description, valor:-e.amount, cor:'#c47d13'}));
    state.attendance.filter(a=>a.obra_id===o.id).forEach(a=>{
      const w = state.workers.find(w=>w.id===a.worker_id);
      items.push({data:a.date, desc:`Frequência — ${w?w.name:'?'}`, valor:null, cor:'#83838f'});
    });
    state.advances.filter(a=>a.obra_id===o.id).forEach(a=>items.push({data:a.date, desc:'Saldo de adiantamento (a descontar) — '+((state.workers.find(w=>w.id===a.worker_id)||{}).name||'?'), valor:null, cor:'#83838f'}));
  }
  items.sort((a,b)=>b.data.localeCompare(a.data));
  const extratoHtml = items.length ? items.map(it=>`
    <div class="row">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <span style="font-size:13px; font-weight:600;">${it.desc}</span>
        <span style="font-size:11px; color:#83838f;">${brDate(it.data)}</span>
      </div>
      <span class="mono" style="font-size:13.5px; font-weight:700; color:${it.cor};">${it.valor===null?'—':(it.valor>0?'+ ':'− ')+BRL(Math.abs(it.valor))}</span>
    </div>`).join('') : `<div class="empty">Nenhum lançamento para este colégio.</div>`;

  // reembolso pendente SÓ desse colégio, por pessoa — pra não pagar reembolso de outro colégio
  // com o dinheiro que acabou de entrar
  let reembolsoColegioHtml = '';
  if(o){
    const pendentesObra = state.expenses.filter(e=>e.obra_id===o.id && !e.reimbursed);
    const porPessoa = {};
    pendentesObra.forEach(e=>{ porPessoa[e.paid_by] = (porPessoa[e.paid_by]||0) + Number(e.amount); });
    const linhas = Object.entries(porPessoa);
    reembolsoColegioHtml = `
      <div style="margin-top:6px;">
        <div style="font-size:14px; font-weight:700; margin-bottom:8px;">Reembolso pendente — só desse colégio</div>
        <div class="card" style="overflow:hidden;">
          ${linhas.length ? linhas.map(([p,v])=>`<div class="row"><span style="font-size:13px; font-weight:600;">${p}</span><span class="mono" style="font-size:13.5px; font-weight:700; color:#c47d13;">${BRL(v)}</span></div>`).join('') : `<div class="empty">Nada pendente pra esse colégio.</div>`}
        </div>
        ${pendentesObra.length ? `<div style="margin-top:6px; font-size:10.5px; color:#83838f;">${pendentesObra.length} lançamento(s) — inclui retroativos sem data exata</div>` : ''}
      </div>`;
  }

  const adminForm = isAdmin ? `
    <div class="admin-panel">
      <div class="title">Admin · novo colégio</div>
      <form class="inline" id="formObra">
        <input name="name" placeholder="Nome do colégio" required>
        <input name="pontos_rede" type="number" min="0" placeholder="Pontos de rede" required>
        <input name="pontos_wifi" type="number" min="0" placeholder="Racks" required>
        <input name="data_entrega_prevista" type="date" placeholder="Data prevista de entrega">
        <button type="submit" class="btn">Cadastrar</button>
      </form>
    </div>` : '';

  document.getElementById('tab-obras').innerHTML = `
    <div style="font-size:14px; font-weight:700;">Colégios — contratos</div>
    <div style="display:flex; flex-direction:column; gap:14px;">${cardsHtml}</div>
    ${adminForm}
    <div style="margin-top:6px;" id="obraDetailAnchor">
      <div style="font-size:14px; font-weight:700; margin-bottom:8px;">Extrato por colégio</div>
      <select class="sel" id="obraSelect">${options}</select>
      ${reembolsoColegioHtml}
      <div style="margin-top:14px;">
        <div style="font-size:14px; font-weight:700; margin-bottom:8px;">Extrato completo</div>
        <div class="card" style="overflow:hidden;">${extratoHtml}</div>
      </div>
    </div>`;
  const selEl = document.getElementById('obraSelect');
  if(selEl) selEl.addEventListener('change', e=>{ selectedObraId = e.target.value; renderObras(); });

  const formObra = document.getElementById('formObra');
  if(formObra) formObra.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const r = await sb.from('obras').insert({
      name: f.get('name'), pontos_rede: parseInt(f.get('pontos_rede'),10), pontos_wifi: parseInt(f.get('pontos_wifi'),10),
      status:'em andamento', data_entrega_prevista: f.get('data_entrega_prevista') || null
    });
    if(r.error){ alert('Erro ao cadastrar: '+r.error.message); return; }
    await loadAll();
  });
}

async function salvarObraSubmit(ev, obraId){
  ev.preventDefault();
  const f = new FormData(ev.target);
  const updates = {
    name: f.get('name'),
    pontos_rede: parseInt(f.get('pontos_rede'),10)||0,
    pontos_wifi: parseInt(f.get('pontos_wifi'),10)||0,
    status: f.get('status'),
    data_entrega_prevista: f.get('data_entrega_prevista') || null,
  };
  if(updates.status==='concluída'){
    const o = state.obras.find(x=>x.id===obraId);
    if(o && o.status!=='concluída') updates.concluded_at = new Date().toISOString();
  }
  const r = await sb.from('obras').update(updates).eq('id', obraId);
  if(r.error){ alert('Erro ao salvar: '+r.error.message); return false; }
  editingObraId = null;
  await loadAll();
  return false;
}

async function marcarConcluida(obraId){
  if(!confirm('Marcar esse colégio como concluído?')) return;
  const r = await sb.from('obras').update({ status:'concluída', concluded_at:new Date().toISOString() }).eq('id', obraId);
  if(r.error){ alert('Erro ao salvar: '+r.error.message); return; }
  await loadAll();
}

/* ===== EQUIPE ===== */
const STATUS_LABELS = { 'em atuação':{label:'Em atuação', cls:'badge ok'}, 'pausa':{label:'Pausa', cls:'badge pend'}, 'removido':{label:'Removido da equipe', cls:'badge'} };
function rateLabel(w){
  if(w.rate==null) return 'sem valor cadastrado';
  if(w.rate_type==='dia') return `${BRL(w.rate)}/dia`;
  if(w.rate_type==='mes') return `${BRL(w.rate)}/mês`;
  if(w.rate_type==='ponto') return `${BRL(w.rate)}/ponto`;
  return BRL(w.rate);
}

let expandedWorkerId = null;

function unitLabel(w){
  if(w.rate_type==='ponto') return 'pontos';
  if(w.rate_type==='mes') return 'meses';
  return 'dias';
}

function renderEquipe(){
  const cardsHtml = state.workers.map(w=>{
    const todos = state.attendance.filter(a=>a.worker_id===w.id);
    const pend = todos.filter(a=>!a.paid);
    const valorPendente = pend.reduce((s,a)=>s+attendanceValue(a),0);
    const adiant = advanceBalance(w.id);
    const net = valorPendente - adiant;
    const totalPago = todos.reduce((s,a)=>s+Number(a.paid_amount||0),0);
    const acertado = net <= 0.005;
    const statusInfo = STATUS_LABELS[w.status] || STATUS_LABELS['em atuação'];

    // quanto ele já executou de verdade (quantidade de pontos/dias), não só valor em dinheiro
    const totalExecutado = todos.reduce((s,a)=>s+(a.count||1), 0);
    const unidade = unitLabel(w);
    // se ele só trabalha num colégio (comum pra quem é pago por ponto), mostra o percentual daquele contrato
    const obrasDoWorker = [...new Set(todos.map(a=>a.obra_id).filter(Boolean))];
    let progressoHtml = '';
    if(w.rate_type==='ponto' && obrasDoWorker.length===1){
      const o = state.obras.find(x=>x.id===obrasDoWorker[0]);
      if(o && o.pontos_rede>0){
        const pct = Math.min((totalExecutado/o.pontos_rede)*100, 100);
        progressoHtml = `
          <div style="margin-top:8px;">
            <div style="font-size:10.5px; color:#83838f; margin-bottom:3px;">Executado em ${o.name}: ${totalExecutado} de ${o.pontos_rede} pontos (${pct.toFixed(0)}%)</div>
            <div style="background:#e6e6ea; border-radius:2px; height:6px; overflow:hidden;">
              <div style="width:${pct}%; background:#6a5cff; height:100%;"></div>
            </div>
          </div>`;
      }
    }

    if(isAdmin && editingWorkerId===w.id){
      return `
      <div class="card admin-panel" style="padding:13px;">
        <div class="title">Editando funcionário</div>
        <form class="inline" onsubmit="return salvarWorkerSubmit(event,'${w.id}')" style="border-top:none; margin-top:0; padding-top:0;">
          <input name="name" value="${w.name}" placeholder="Nome" required>
          <input name="rate" type="number" step="0.01" value="${w.rate!=null?w.rate:''}" placeholder="Valor" required>
          <select name="rate_type">
            <option value="dia" ${w.rate_type==='dia'?'selected':''}>Por dia</option>
            <option value="mes" ${w.rate_type==='mes'?'selected':''}>Por mês</option>
            <option value="ponto" ${w.rate_type==='ponto'?'selected':''}>Por ponto instalado</option>
          </select>
          <select name="status">
            <option value="em atuação" ${w.status==='em atuação'?'selected':''}>Em atuação</option>
            <option value="pausa" ${w.status==='pausa'?'selected':''}>Pausa</option>
            <option value="removido" ${w.status==='removido'?'selected':''}>Removido da equipe</option>
          </select>
          <button type="submit" class="btn small">Salvar</button>
          <button type="button" class="btn small ghost" onclick="editingWorkerId=null; renderEquipe();">Cancelar</button>
        </form>
      </div>`;
    }

    const payAction = (isAdmin && net>0.005) ? `
      <form class="inline" style="margin-top:10px; border-top:none; padding-top:0;" onsubmit="return pagarFolhaSubmit(event,'${w.id}')">
        <input type="number" step="0.01" placeholder="Valor a pagar" name="valor" required style="flex:1;">
        <button type="submit" class="btn small">Pagar</button>
      </form>` : '';
    const editAction = isAdmin ? `<button class="btn small ghost" style="margin-top:8px;" onclick="editingWorkerId='${w.id}'; renderEquipe();">Editar</button>` : '';

    const isOpen = expandedWorkerId===w.id;
    const historico = [...todos].sort((a,b)=>b.date.localeCompare(a.date));
    const historicoHtml = isOpen ? `
      <div style="margin-top:10px; border-top:1px dashed #e6e6ea; padding-top:8px;">
        ${historico.length ? historico.map(a=>{
          const o = state.obras.find(o=>o.id===a.obra_id);
          const valorLinha = a.fixed_amount!=null ? Number(a.fixed_amount) : (w.rate!=null ? w.rate*(a.count||1) : 0);
          const pago = Number(a.paid_amount||0);
          let statusTxt = 'pendente', statusCls = 'badge pend';
          if(a.paid){ statusTxt='pago'; statusCls='badge ok'; }
          else if(pago>0){ statusTxt='parcial'; statusCls='badge pend'; }
          return `<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #e6e6ea;">
            <div style="display:flex; flex-direction:column; gap:1px;">
              <span style="font-size:12px; font-weight:600;">${a.count} ${unitLabel(w)} · ${o?o.name:'Geral'}</span>
              <span style="font-size:10px; color:#83838f;">${brDate(a.date)}${a.note?' · '+a.note:''}</span>
            </div>
            <div style="text-align:right;">
              <span class="${statusCls}" style="font-size:9px;">${statusTxt}</span>
              <div class="mono" style="font-size:12px; font-weight:700; margin-top:2px;">${BRL(valorLinha)}</div>
            </div>
          </div>`;
        }).join('') : `<div class="empty">Nenhuma execução registrada ainda.</div>`}
      </div>` : '';

    return `
    <div class="card" style="padding:13px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; cursor:pointer;" onclick="expandedWorkerId=expandedWorkerId==='${w.id}'?null:'${w.id}'; renderEquipe();">
        <div style="font-size:14px; font-weight:700;">${w.name} <span style="color:#83838f; font-size:11px;">${isOpen?'▲':'▼'}</span></div>
        <div style="display:flex; gap:6px; align-items:center;">
          ${acertado ? `<span class="badge ok">Acertado · pago 100%</span>` : ''}
          <span class="${statusInfo.cls}">${statusInfo.label}</span>
        </div>
      </div>
      <div style="font-size:11px; color:#83838f; margin-top:2px;">${rateLabel(w)} · executado: ${totalExecutado} ${unidade}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px 8px; margin-top:10px;">
        <div><div class="label" style="font-size:10px;">Pendente</div><div class="mono" style="font-size:14px; font-weight:700;">${pend.length} (${BRL(valorPendente)})</div></div>
        <div><div class="label" style="font-size:10px;">Adiantado</div><div class="mono" style="font-size:14px; font-weight:700;">${BRL(adiant)}</div></div>
        <div><div class="label" style="font-size:10px;">Já pago</div><div class="mono" style="font-size:14px; font-weight:700; color:#6a5cff;">${BRL(totalPago)}</div></div>
        <div><div class="label" style="font-size:10px;">Saldo líquido</div><div class="mono" style="font-size:14px; font-weight:700; color:${net>=0?'#c47d13':'#6a5cff'};">${BRL(net)}</div></div>
      </div>
      ${progressoHtml}
      ${historicoHtml}
      ${editAction}
      ${payAction}
    </div>`;
  }).join('') || `<div class="empty">Nenhum funcionário cadastrado.</div>`;

  const adiantHtml = state.advances.length ? state.advances.map(a=>{
    const w = state.workers.find(w=>w.id===a.worker_id);
    return `
    <div class="row">

async function pagarFolhaSubmit(ev, workerId){
  ev.preventDefault();
  const input = ev.target.querySelector('[name=valor]');

  await pagarFolha(workerId, valor);
  return false;
}

// mesma lógica do bot do Telegram: quita dias pendentes em ordem, parcial se não der pra cobrir o dia inteiro, sobra vira adiantamento
async function pagarFolha(workerId, valor){
  const worker = state.workers.find(w=>w.id===workerId);
  if(!worker) return;
  let restante = valor;
  const pendentes = state.attendance.filter(a=>!a.paid && a.worker_id===workerId).sort((a,b)=>a.date.localeCompare(b.date));

  for(const a of pendentes){
    if(restante <= 0.005) break;
    const valorDia = a.fixed_amount != null ? Number(a.fixed_amount) : ((worker.rate_type==='dia' || worker.rate_type==='ponto') ? worker.rate*(a.count||1) : worker.rate);
    if(!valorDia || valorDia<=0) continue;
    const jaPago = Number(a.paid_amount||0);
    const residual = valorDia - jaPago;
    if(residual <= 0.005) continue;

    if(restante >= residual){
      await sb.from('attendance').update({ paid:true, paid_amount:valorDia, settled_date:new Date().toISOString().slice(0,10), settled_from:'pagamento_admin' }).eq('id', a.id);
      restante -= residual;
    } else {
      await sb.from('attendance').update({ paid_amount: jaPago+restante, settled_from:'pagamento_parcial_admin' }).eq('id', a.id);
      restante = 0;
    }
  }

  if(restante > 0.005){
    await sb.from('advances').insert({ worker_id:workerId, date:new Date().toISOString().slice(0,10), amount:restante, paid_by:'Admin', balance:restante });
  }
  await loadAll();
}
